[project]
name = "embedding-recommendation-system"
version = "0.1.0"
description = "Offline experiments for related-video recommendation using semantic embeddings."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.3,<2.4",
]

[project.optional-dependencies]
gpu = [
    "vllm==0.25.1 ; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
